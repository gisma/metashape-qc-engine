# Operational defaults loaded automatically by level1b_dumb_runner.py.
# Values in this file affect the normal Level-1B run unless a comment below
# explicitly identifies the key as provenance/report metadata only.
level1b:
  channels:
    # One-based source-band positions interpreted as red, green, and blue.
    # These positions drive masked RGB creation and the ExGR, ExR, and BRI
    # expressions in the proxy-stack recipe.
    rgb_band_indices: [1, 2, 3]

    # Fine directional GLCM measurement radius in metres. It is converted to
    # pixels as max(1, round(radius_m / ortho_pixel_size_m)) and invokes one
    # Haralick Inertia extraction for every configured direction.
    dglcm_pc1_small_radius_m: 0.2

    # Coarse directional GLCM measurement radius in metres. It uses the same
    # metre-to-pixel conversion and must be larger than the small radius.
    dglcm_pc1_large_radius_m: 0.5

    # Lower and upper valid-pixel quantiles used to clip RGB-PC1 before
    # Haralick extraction. Values must satisfy 0 <= lower < upper <= 1.
    pc1_clip_quantiles: [0.02, 0.98]

    # Output range used to rescale the clipped PC1. These values are also
    # passed to HaralickTextureExtraction as parameters.min and parameters.max.
    pc1_output_min: 0
    pc1_output_max: 255

    # Number of grey-level bins used by every HaralickTextureExtraction call.
    # This controls GLCM quantization and must be an integer greater than one.
    glcm_nbbin: 32

    # Pixel-offset vectors [xoff, yoff] evaluated at both DGLCM radii. Each
    # pair invokes one Haralick call per radius; Inertia is aggregated with a
    # pixelwise maximum. The angle is atan2(yoff, xoff) in image-grid space,
    # not a geographic bearing: [1,0]=0°, [1,1]=45°, [0,1]=90°,
    # [-1,1]=135°. Examples: [2,1] is about 26.6° and [1,2] about 63.4°.
    # Vector magnitude also changes pixel-pair distance; do not use [0,0].
    glcm_directions:
      - [1, 0]
      - [1, 1]
      - [0, 1]
      - [-1, 1]

    # Small positive constant added to the coarse-structure denominator to
    # prevent division by zero. It materially affects only values near zero.
    ratio_eps: 1.0e-6

    # Value assigned to invalid RGB pixels before PCA. The same value is passed
    # as the PCA background value and excluded from valid PC1 quantiles.
    background_value: -999999.0

    # Filename of the channel-construction JSON report under
    # <run_root>/level1b/channels/. It does not change the proxy raster name.
    report_filename: "channel_report.json"

  candidate_pre_screening:
    # Admissible radius domain in metres, not concrete Step-9a anchors. Stable
    # variogram sill crossings materialize the scene-specific scale ladder.
    # For SAGA, each materialized radius also defines a deterministic seed
    # density: each translated metric-hex support-cell area equals
    # pi * radius_px^2. Each nominal centre may snap by at most 0.45*radius_px
    # to a local multiband-variance minimum; seeds remain at least radius_px
    # apart and every valid pixel must lie within 2*radius_px of a seed.
    # radius_min_m also defines the common technical minsize provenance:
    # radius_px = round_half_up(radius_min_m / pixel_size_m), diameter_px = 2*radius_px,
    # minsize_px = diameter_px^2. The SAGA backend does not perform a later
    # minimum-size merge; minsize_px remains descriptive scale metadata and is
    # deliberately not an independent perturbation axis.
    radius_min_m: 0.1
    radius_max_m: 4.0

    # Logarithmic lag sampling inside the radius domain. Pixel rounding can
    # reduce the number of distinct sampled lags.
    lag_count: 32
    lag_spacing: "logarithmic"
    directions:
      - [1, 0]
      - [1, 1]
      - [0, 1]
      - [-1, 1]

    # Valid-pair sampling for the robust multiband empirical variogram.
    pair_sample_n_per_direction: 5000
    min_valid_pairs_per_direction: 500

    # The sill is the median semivariance in the last 25% of sampled lags.
    sill_tail_fraction: 0.25
    plateau_rel_tol: 0.10

    # Stable first crossings create support points on one continuous curve.
    # They are not analysis classes and receive identical Step-9 treatment.
    sill_fraction_targets: [0.25, 0.50, 0.75, 0.95]
    stable_crossing_window: 2

    # Diagnostic-only anisotropy flag threshold; it never selects candidates.
    anisotropy_ratio_threshold: 1.5

    # Four translations of the same metric hexagonal lattice form the
    # deterministic seed-realization ensemble. Coordinates are fractions of
    # the two lattice basis vectors, not metres or pixels. Phase [0,0] is the
    # reference realization; all phases receive identical downstream rules.
    seed_phase_offsets:
      - [0.0, 0.0]
      - [0.5, 0.0]
      - [0.0, 0.5]
      - [0.5, 0.5]

    # Hard cap across scale x ranger x seed phase. Pre-screening fails instead
    # of truncating the factorial ensemble.
    candidate_budget: 48

    # Central HSM plus positive unique bounds of its shortest half interval.
    # No feature-distance tail quantiles are used.
    ranger_level_policy: "hsm_main_interval_lower_mode_upper"

    # Maximum number of valid scaled feature vectors sampled from the complete
    # raster before ranger estimation. If fewer vectors exist, all are used.
    # Above a sufficiently representative sample this mainly affects sampling
    # stability and memory, not the intended segmentation scale.
    sample_n: 80000

    # Automatic pre-segmentation selection of the local feature-space
    # neighbourhood order. No segmentation is run while selecting k.
    knn_k_policy: "auto_hsm_plateau"

    # Candidate neighbour ranks evaluated on the same deterministic vector
    # sample. Denser low-k spacing resolves short early plateaus; the later
    # approximately geometric spacing still probes broader neighbourhoods.
    knn_k_candidates: [8, 10, 13, 16, 21, 27, 34, 44, 55]

    # Maximum relative HSM-ranger span accepted within one plateau window:
    # (max(ranger) - min(ranger)) / median(ranger) <= this value.
    # A value of 0.10 therefore permits at most 10% spread in the window.
    hsm_stability_rel_tol: 0.10

    # Number of consecutive k candidates required for a stable plateau. The
    # smallest k in the first stable window is selected. If no such window is
    # found, pre-screening fails and records the diagnostic curve; there is no
    # fallback to a fixed k.
    hsm_plateau_window: 3

    # Maximum vectors entering the expensive pairwise kNN distance calculation
    # after the first sample. A deterministic subsample is used above this
    # limit. Larger values reduce sampling noise but increase approximately
    # quadratic computation. This value must exceed the largest k candidate.
    max_distance_sample_n: 15000

    # Controls both valid-pair sampling and feature-vector subsampling.
    seed: 1
