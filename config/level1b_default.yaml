level1b:
  feature_band_count: 6

  channels:
    input_type: "rgb"
    rgb_band_indices: [1, 2, 3]
    dglcm_pc1_small_radius_m: 0.25
    dglcm_pc1_large_radius_m: 0.5
    background_value: -999999.0
    report_filename: "channel_report.json"

  scale_distribution:
    # Deterministic Step-9a baseline candidate radii in metres.
    # Each value defines one central baseline family; the existing perturbation
    # generator creates the local spatialr/minsize/ranger variants around it.
    # These defaults reproduce the former pre-DGLCM ladder for comparison.
    baseline_candidate_radii_m:
      - 0.2
      - 0.3618081437156948
      - 0.6545256642949843
      - 1.1840635780642512
      - 2.142019226103952
      - 3.875

  feature_range:
    feature_space_source: "scaled"
    sample_n: 50000
    knn_k: 10
    max_distance_sample_n: 8000
    quantile_probs: [0.25, 0.5, 0.75, 0.9]

  candidate_response_surface:
    segmentation_stack_source: "scaled_proxy_stack"
