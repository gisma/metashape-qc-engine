level1b:
  feature_band_count: 6

  channels:
    input_type: "rgb"
    rgb_band_indices: [1, 2, 3]
    dglcm_pc1_small_radius_m: 0.25
    dglcm_pc1_large_radius_m: 0.5
    background_value: -999999.0
    report_filename: "channel_report.json"

  scale_distribution:
    scale_mode: "structure_derived_scale_distribution"

    metric_radius_m: null
    structure_radius_m: null

    proxy_structure_mode: "texture_preferred"
    proxy_band_indices: null
    texture_band_indices: [4, 5]

    infer_texture_support_from_proxy: true
    infer_structure_support_from_proxy: true
    sampling_regime: "auto"

    structure_support_max_m: null
    texture_support_max_m: null
    target_structure_max_m: null
    segment_similarity_radius_max_m: null

    upper_radius_factor: 2.5
    max_radius_m: null
    patch_radius_quantiles: [0.25, 0.4, 0.55, 0.7, 0.85, 0.95]
    min_radius_m: null
    max_candidate_radius_fraction: 0.775

    output_csv_filename: "scale_candidates.csv"
    output_json_filename: "scale_candidates.json"

  feature_range:
    feature_space_source: "scaled"
    sample_n: 50000
    knn_k: 10
    max_distance_sample_n: 8000
    quantile_probs: [0.25, 0.5, 0.75, 0.9]

  candidate_response_surface:
    segmentation_stack_source: "scaled_proxy_stack"
